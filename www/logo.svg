<svg width="100%" height="100vh" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" style="background:#0A0F1E; display:block;">
  <defs>
    <!-- Main Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Shimmer gradient for progress -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0072FF" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Glow for drawn text + bar -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. DexCode Text with SLOW Draw -->
  <text 
    x="200" 
    y="90" 
    text-anchor="middle" 
    dominant-baseline="middle"
    font-family="Poppins, Inter, Arial, sans-serif" 
    font-weight="800" 
    font-size="40" 
    fill="none"
    stroke="url(#blueGrad)"
    stroke-width="2.5"
    filter="url(#textGlow)"
    stroke-dasharray="500"
    stroke-dashoffset="500">
    DexCode
    <animate
      attributeName="stroke-dashoffset"
      values="500;0;0;500"
      keyTimes="0;0.57;0.86;1"
      dur="3.5s"
      repeatCount="indefinite"/>
  </text>
  
  <!-- 2. Fill effect after draw -->
  <text 
    x="200" 
    y="90" 
    text-anchor="middle" 
    dominant-baseline="middle"
    font-family="Poppins" 
    font-weight="800" 
    font-size="40" 
    fill="url(#blueGrad)"
    opacity="0">
    DexCode
    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.57;0.62;1"
      dur="3.5s"
      repeatCount="indefinite"/>
  </text>
  
  <!-- 3. IMPROVED Progress bar -->
  <g transform="translate(80,130)">
    <!-- Track -->
    <rect width="240" height="8" rx="4" fill="#1E293B"/>
    
    <!-- Progress fill with easing -->
    <rect id="progressFill" width="0" height="8" rx="4" fill="url(#blueGrad)" filter="url(#textGlow)">
      <animate 
        attributeName="width" 
        values="0;240;240;0" 
        keyTimes="0;0.57;0.86;1"
        keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
        calcMode="spline"
        dur="3.5s" 
        repeatCount="indefinite"/>
    </rect>

    <!-- Shimmer effect sliding across -->
    <rect width="60" height="8" rx="4" fill="url(#shimmer)" opacity="0.8">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0;240;-60;0"
        keyTimes="0;0.57;0.86;1"
        dur="3.5s"
        repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- 4. Loading text -->
  <text x="200" y="165" text-anchor="middle" font-family="Poppins" font-size="14" fill="#94A3B8" letter-spacing="1">
    Loading
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>